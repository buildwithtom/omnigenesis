<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080908">
  <meta name="description" content="Scroll through the history of existence. An interactive journey from the earliest universe to the formation of Earth.">
  <link rel="icon" href="data:,">
  <title>OmniGenesis — The History of Everything</title>
</head>
<body>
  <main id="experience" aria-label="OmniGenesis cosmic timeline">
    <div id="stage">
      <canvas id="cosmos" aria-hidden="true"></canvas>
      <div class="scene-shade" aria-hidden="true"></div>
      <div id="origin" aria-hidden="true"></div>
      <button id="menu-trigger" class="instrument-trigger" aria-label="Index" aria-haspopup="dialog" aria-controls="instrument" aria-expanded="false"><i class="diamond" aria-hidden="true"><i></i></i></button>
      <button id="begin" aria-label="Begin the journey">
        <span class="mouse-shell" aria-hidden="true"><span class="mouse-wheel"></span></span>
      </button>
      <article class="caption" hidden>
        <h1 id="chapter-heading"><button id="caption-link" aria-haspopup="dialog" aria-controls="instrument"></button></h1>
        <canvas id="letter-dust" aria-hidden="true"></canvas>
        <small id="conclusion" hidden>Forthcoming</small>
      </article>
      <button id="settings-trigger" class="gear-button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-controls="instrument" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#gear"/></svg></button>
      <button id="sound" aria-label="Soundtrack" aria-pressed="true" title="Mute soundtrack"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
    </div>
    <div id="scroll-space" aria-hidden="true"></div>
    <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><symbol id="gear" viewBox="0 0 24 24"><path d="m9.5 3 .6-1h3.8l.6 2.6 1.6.9 2.5-.8 1.9 3.3-1.9 1.8v2.1l1.9 1.8-1.9 3.3-2.5-.8-1.6.9-.6 2.6h-3.8l-.6-2.6-1.6-.9-2.5.8-1.9-3.3 1.9-1.8V9.8L3.5 8l1.9-3.3 2.5.8 1.6-.9z" transform="translate(0 1)"/><circle cx="12" cy="12" r="3.1"/></symbol></svg>
  <dialog id="instrument" aria-labelledby="panel-title"><div class="panel-inner"><div class="panel-toolbar"><span id="act-label" class="micro">Act I</span><button id="panel-back" hidden aria-label="Back to index"><span aria-hidden="true">‹</span> Index</button><button id="dismiss" aria-label="Close index">×</button></div><div id="panel-content"></div></div></dialog>
  <noscript>OmniGenesis needs JavaScript to run the interactive timeline.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
