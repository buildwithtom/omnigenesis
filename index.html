<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080908">
  <meta name="description" content="Scroll through the history of existence. An interactive journey from the earliest universe to the formation of Earth.">
  <link rel="icon" href="./emblem.svg" type="image/svg+xml">
  <title>OmniGenesis — The History of Everything</title>
</head>
<body>
  <main id="experience" aria-label="OmniGenesis cosmic timeline">
    <div id="stage">
      <div id="overture" aria-hidden="true"></div>
      <canvas id="cosmos" aria-hidden="true"></canvas>
      <div class="scene-shade" aria-hidden="true"></div>
      <div class="chart" aria-hidden="true"><div id="engraving"></div></div>
      <div class="brand"><img src="./emblem.svg" alt=""><span>OmniGenesis</span></div>
      <button id="menu-trigger" class="instrument-trigger micro" aria-haspopup="dialog" aria-controls="instrument" aria-expanded="false"><span>Index</span><i class="diamond"><i></i></i></button>
      <article class="caption" aria-labelledby="chapter-heading">
        <div class="act-label micro"><span class="rule"></span>Act I <b>/</b> From the Unknown to Earth</div>
        <h1 id="chapter-heading">Everything began<br><em>somewhere.</em></h1>
        <p id="chapter-copy">Or perhaps somewhere began with everything.</p>
        <div id="conclusion" hidden><em>Act II — The Living Earth</em><span class="micro"> Forthcoming</span></div>
        <button id="primary" class="primary"><span class="circle-arrow" aria-hidden="true">↓</span><span id="primary-label">Begin the journey</span></button>
      </article>
      <div class="figure-legend micro" aria-hidden="true"><span id="figure-number">Fig. 00</span><i></i><span id="figure-title">Symbolic origin</span></div>
      <div class="floor">
        <div class="floor-meta">
          <div><div class="micro label"><i class="live-point"></i>Current epoch</div><div class="epoch-value"><span id="epoch-id">00</span><i>/</i><span id="epoch-title">The Unknown</span></div></div>
          <button id="scroll-cue" class="scroll-cue micro"><i aria-hidden="true"></i>Scroll to explore</button>
          <button id="sound" class="sound micro" aria-pressed="false"><i class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></i><span>Sound off</span></button>
        </div>
        <nav id="ruler" aria-label="Chapter timeline"></nav>
        <div class="ruler-legend micro"><span>Act I timeline</span><span id="percent">0% traversed</span></div>
      </div>
    </div>
    <div id="scroll-space" aria-hidden="true"></div>
    <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <dialog id="instrument" aria-labelledby="panel-title"><div class="panel-inner"><div class="panel-toolbar"><span class="micro">OmniGenesis <b>/</b> Act I</span><button id="dismiss" aria-label="Close index">×</button></div><div id="panel-content"></div></div></dialog>
  <noscript>OmniGenesis needs JavaScript to run the interactive timeline.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
